name: Tests

on:
  push:
    branches: [main, 19.0]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          path: custom_addons/hr_hospital

      - name: Clone Odoo 19
        run: git clone --branch 19.0 --depth 1 https://github.com/odoo/odoo.git odoo

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: odoo/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libpq-dev libxml2-dev libxslt1-dev libldap2-dev libsasl2-dev

      - name: Install Python dependencies
        run: pip install -r odoo/requirements.txt

      - name: Run module tests
        run: |
          python odoo/odoo-bin \
            --db_host=127.0.0.1 --db_user=odoo --db_password=odoo \
            --addons-path=odoo/addons,custom_addons \
            -d test_hr_hospital -i hr_hospital --with-demo \
            --test-enable --test-tags /hr_hospital \
            --stop-after-init --log-level=warn \
            --log-handler odoo.tests:INFO \
            --log-handler odoo.addons.hr_hospital.tests:INFO \
            --log-handler odoo.modules.loading:INFO
